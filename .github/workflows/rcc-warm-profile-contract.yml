name: CNGB RCC General-Pool contract

on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
      rcc_facade_label:
        required: true
        type: string
      rcc_assignment_label:
        required: true
        type: string

permissions:
  contents: read

jobs:
  qualify:
    name: Validate cardinality-blind General-Pool consumer
    runs-on:
      - self-hosted
      - ${{ inputs.rcc_facade_label }}
      - ${{ inputs.rcc_assignment_label }}
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      RCC_EXPECTED_FACADE: ${{ inputs.rcc_facade_label }}
      RCC_ASSIGNMENT_LABEL: ${{ inputs.rcc_assignment_label }}
    steps:
      - name: Prove exact RCC assignment
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "$RCC_EXPECTED_FACADE"
          [[ "$RCC_ASSIGNMENT_LABEL" =~ ^rcc-assignment-proof-[0-9a-f]{32}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "CNGB_RCC_ASSIGNMENT=PASS runner=$RUNNER_NAME"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Validate Demand-v2 hardcut
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path(".")
          assert not (root / ".rcc/runner-contract.json").exists()
          assert not (root / ".rcc/runner-profiles").exists()
          demand = json.loads((root / ".rcc/workload-demands.json").read_text())
          assert demand["schema_version"] == "cngb.rcc_workload_demands.v2"
          assert demand["repository_id"] == 1276271604
          assert demand["authority"]["allocation"] == "RCC_AUTO_ONLY"
          assert demand["authority"]["github_hosted_fallback"] is False
          assert demand["authority"]["broad_project_routing"] is False
          assert demand["authority"]["consumer_runner_lifecycle"] is False
          text = (root / ".rcc/workload-demands.json").read_text()
          for forbidden in (
              "desired_count", "min_active", "max_active",
              "cngb-linux", "warm-runner-heartbeat", "warm-runner-route",
              "physical_members", "consumer_facades",
          ):
              assert forbidden not in text
          print("CNGB_GENERAL_POOL_HARDCUT=PASS")
          PY
