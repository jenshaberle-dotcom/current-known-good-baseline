name: Warm runner route

on:
  workflow_call:
    inputs:
      heartbeat_workflow: { required: true, type: string }
      heartbeat_max_age_seconds: { required: false, default: 900, type: number }
      warm_runs_on_json: { required: true, type: string }
      hosted_runs_on_json: { required: true, type: string }
    outputs:
      route: { value: "${{ jobs.route.outputs.route }}" }
      runs_on_json: { value: "${{ jobs.route.outputs.runs_on_json }}" }
      reason: { value: "${{ jobs.route.outputs.reason }}" }
permissions:
  actions: read
  contents: read
jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      route: ${{ steps.route.outputs.route }}
      runs_on_json: ${{ steps.route.outputs.runs_on_json }}
      reason: ${{ steps.route.outputs.reason }}
    steps:
      - id: route
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEARTBEAT_WORKFLOW: ${{ inputs.heartbeat_workflow }}
          HEARTBEAT_MAX_AGE_SECONDS: ${{ inputs.heartbeat_max_age_seconds }}
          WARM_RUNS_ON_JSON: ${{ inputs.warm_runs_on_json }}
          HOSTED_RUNS_ON_JSON: ${{ inputs.hosted_runs_on_json }}
        run: |
          set -euo pipefail
          hosted() { echo 'route=github-hosted' >> "$GITHUB_OUTPUT"; echo "runs_on_json=$HOSTED_RUNS_ON_JSON" >> "$GITHUB_OUTPUT"; echo "reason=$1" >> "$GITHUB_OUTPUT"; echo "ROUTE=github-hosted reason=$1"; }
          payload="$(mktemp)"
          if ! gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' "repos/${GITHUB_REPOSITORY}/actions/workflows/${HEARTBEAT_WORKFLOW}/runs?per_page=10" >"$payload" 2>/dev/null; then hosted heartbeat-unavailable; exit 0; fi
          if jq -e '.workflow_runs[]? | select(.status == "in_progress")' "$payload" >/dev/null; then echo 'route=warm' >> "$GITHUB_OUTPUT"; echo "runs_on_json=$WARM_RUNS_ON_JSON" >> "$GITHUB_OUTPUT"; echo 'reason=heartbeat-in-progress' >> "$GITHUB_OUTPUT"; exit 0; fi
          last="$(jq -r '[.workflow_runs[]? | select(.conclusion == "success")][0].updated_at // empty' "$payload")"
          if [[ -z "$last" ]]; then hosted no-successful-heartbeat; exit 0; fi
          now="$(date -u +%s)"; then_epoch="$(date -u -d "$last" +%s 2>/dev/null || echo 0)"; age=$((now-then_epoch))
          if (( then_epoch > 0 && age >= 0 && age <= HEARTBEAT_MAX_AGE_SECONDS )); then echo 'route=warm' >> "$GITHUB_OUTPUT"; echo "runs_on_json=$WARM_RUNS_ON_JSON" >> "$GITHUB_OUTPUT"; echo 'reason=heartbeat-fresh' >> "$GITHUB_OUTPUT"; else hosted heartbeat-stale; fi
