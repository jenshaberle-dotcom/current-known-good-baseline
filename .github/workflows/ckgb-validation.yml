name: CI · CKGB validation
run-name: "CI · CKGB validation | ref=${{ github.ref_name }} | sha=${{ github.event.pull_request.head.sha || github.sha }}"

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ckgb-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate CKGB
    runs-on: don-linux
    timeout-minutes: 15

    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify repository identity
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "jenshaberle-dotcom/current-known-good-baseline"
          test "${GITHUB_REPOSITORY_ID}" = "1276271604"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12.3"
          cache: pip

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff

      - name: Ruff
        run: python -m ruff check .

      - name: Pytest
        run: python -m pytest -q
