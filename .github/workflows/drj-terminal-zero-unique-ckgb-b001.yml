name: DRJ CKGB Fresh Terminal Preflight

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/drj-terminal-zero-unique-ckgb-b001.yml

permissions:
  contents: read
  pull-requests: read

jobs:
  observe:
    if: >-
      github.event.pull_request.head.ref == 'drj/76-terminal-zero-unique-ckgb-b001' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.user.login == 'jenshaberle-dotcom'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fresh read-only preflight for legacy terminal set
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import quote, urlencode
          from urllib.request import Request, urlopen

          REPOSITORY = "jenshaberle-dotcom/current-known-good-baseline"
          REPOSITORY_ID = 1276271604
          EXPECTED_MAIN = "2834c2e3a1c21ba03a46a7c929447f636aaae387"
          TARGETS = [
            ("agent/ckgb-deadwalker-quarantine-001b","dc638b76c6dd1d8cee02c646cea039fe5503a7f2"),
            ("agent/knowledge-research-layer-v1","5b28a7e681e1aa2f3ce57def780175552f6cdf71"),
            ("agent/portfolio-foundations-align-v1","3684b148fbbf29e528739fee471baae65c770365"),
            ("agent/portfolio-reentry-v1","d19ad96f71812fbfae3a6d3f1f7bc9573a6933c3"),
            ("agent/post-migration-restart-gate-v1","f757a060079f0687fe3762634eafbb58f8c78dbe"),
            ("agent/project-state-reconcile-v2","82a8efb18ed11794e0424af0618efd60ed1b3e97"),
            ("agent/rcc-cngb-platform-only-warm-profile-001a","c913bb273b2df4b7893fb6e83267f85f12570c32"),
            ("agent/warm-hosted-fallback-001a","87a54997e0426676f929cee62ed53d67c4d7c139"),
            ("drj/workspace-v2-wsl-canonical","40cf703d04af7292e96a2238f1a48cf0ca319252"),
            ("drj-013-work-admission-001a","4e6ddf9a03752bd003292afc989a5ee7db470cad"),
            ("ops/rcc-runner-contract-v1","d0e63b1837c3e4aee9dac5644cf8e0249dc2d100"),
            ("agent/ckgb-deadwalker-harvest-001a","37b1db17201df9a545d98c2ab2b4415c12a5bae2"),
            ("agent/ckgb-post-harvest-hygiene-001a","8680987a57ae0e1c47354fbb9306aa938ae2f9fa"),
          ]
          PRESERVE = [
            "agent/ckgb-reentry-failure-antipatterns-001a",
            "agent/ckgb-final-hygiene-pass-001a",
          ]
          token = os.environ["GH_TOKEN"]
          root = f"https://api.github.com/repos/{REPOSITORY}"
          out = Path("/tmp/drj-ckgb-fresh-preflight.json")

          def api(path, allow_404=False):
            req = Request(root + path, headers={
              "Accept":"application/vnd.github+json",
              "Authorization":f"Bearer {token}",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"drj-ckgb-fresh-terminal-preflight",
            })
            try:
              with urlopen(req, timeout=30) as r:
                return json.loads(r.read())
            except HTTPError as exc:
              if allow_404 and exc.code == 404:
                return None
              raise

          repo = api("")
          main = str((api("/git/ref/heads/main").get("object") or {}).get("sha") or "")
          if int(repo["id"]) != REPOSITORY_ID or str(repo["default_branch"]) != "main":
            raise SystemExit("repository identity/default mismatch")
          if main != EXPECTED_MAIN:
            raise SystemExit(f"canonical CKGB main moved: {main}")

          owner = REPOSITORY.split('/', 1)[0]
          rows = []
          for branch, expected in TARGETS:
            row = {"branch":branch,"expected_sha":expected}
            ref = api(f"/git/ref/heads/{quote(branch, safe='/')}", allow_404=True)
            if ref is None:
              row["state"] = "ALREADY_ABSENT"
              rows.append(row)
              continue
            observed = str((ref.get("object") or {}).get("sha") or "")
            row["observed_sha"] = observed
            if observed != expected:
              row["state"] = "PRESERVE_SHA_DRIFT"
              rows.append(row)
              continue
            branch_meta = api(f"/branches/{quote(branch, safe='')}")
            row["protected"] = bool(branch_meta.get("protected", False))
            h = urlencode({"state":"open","head":f"{owner}:{branch}","per_page":"1"})
            b = urlencode({"state":"open","base":branch,"per_page":"1"})
            row["open_pr_head"] = bool(api(f"/pulls?{h}"))
            row["open_pr_base"] = bool(api(f"/pulls?{b}"))
            cmp = api(f"/compare/main...{quote(branch, safe='')}")
            row["ahead_by"] = int(cmp["ahead_by"])
            row["behind_by"] = int(cmp["behind_by"])
            if row["protected"]:
              row["state"] = "PRESERVE_PROTECTED"
            elif row["open_pr_head"] or row["open_pr_base"]:
              row["state"] = "PRESERVE_OPEN_PR"
            elif row["ahead_by"] != 0:
              row["state"] = "PRESERVE_DIVERGENT"
            else:
              row["state"] = "SAFE_ZERO_UNIQUE"
            rows.append(row)

          counts = {}
          for row in rows:
            counts[row["state"]] = counts.get(row["state"], 0) + 1
          receipt = {
            "schema_version":"drj.ckgb_fresh_terminal_preflight.v1",
            "repository":REPOSITORY,
            "repository_id":REPOSITORY_ID,
            "main":main,
            "rows":rows,
            "counts":counts,
            "preserve":PRESERVE,
            "effects":[],
          }
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
            "# CKGB fresh terminal preflight\n\n" + "\n".join(f"- {k}: **{v}**" for k,v in sorted(counts.items())) + "\n",
            encoding="utf-8",
          )
          PY
      - name: Preserve fresh preflight receipt
        uses: actions/upload-artifact@v4
        with:
          name: drj-ckgb-fresh-preflight-${{ github.run_id }}
          path: /tmp/drj-ckgb-fresh-preflight.json
          if-no-files-found: error
          retention-days: 90
