name: DRJ CKGB Carrier Self-Retire

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/drj-terminal-zero-unique-ckgb-b001.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  retire-carrier:
    if: >-
      github.event.pull_request.number == 24 &&
      github.event.pull_request.head.ref == 'drj/76-terminal-zero-unique-ckgb-b001' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.user.login == 'jenshaberle-dotcom'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retire only this ephemeral DRJ carrier ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          REPOSITORY = "jenshaberle-dotcom/current-known-good-baseline"
          REPOSITORY_ID = 1276271604
          EXPECTED_MAIN = "2834c2e3a1c21ba03a46a7c929447f636aaae387"
          PR_NUMBER = 24
          CARRIER = "drj/76-terminal-zero-unique-ckgb-b001"
          token = os.environ["GH_TOKEN"]
          root = f"https://api.github.com/repos/{REPOSITORY}"
          out = Path("/tmp/drj-ckgb-carrier-retire.json")

          def api(method, path, allow_404=False):
            req = Request(root + path, method=method, headers={
              "Accept":"application/vnd.github+json",
              "Authorization":f"Bearer {token}",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"drj-ckgb-carrier-self-retire",
            })
            try:
              with urlopen(req, timeout=30) as r:
                raw = r.read()
                return json.loads(raw) if raw else None
            except HTTPError as exc:
              if allow_404 and exc.code == 404:
                return None
              raise RuntimeError(f"GitHub API {method} {path} failed: {exc.code}") from exc

          repo = api("GET", "")
          if int(repo["id"]) != REPOSITORY_ID or str(repo["default_branch"]) != "main":
            raise SystemExit("repository identity/default mismatch")
          main = str((api("GET", "/git/ref/heads/main").get("object") or {}).get("sha") or "")
          if main != EXPECTED_MAIN:
            raise SystemExit(f"canonical main moved: {main}")
          pr = api("GET", f"/pulls/{PR_NUMBER}")
          if str(pr.get("state")) != "open":
            raise SystemExit("carrier PR is not open")
          if str((pr.get("head") or {}).get("ref")) != CARRIER:
            raise SystemExit("carrier PR head mismatch")
          if str((pr.get("base") or {}).get("ref")) != "main":
            raise SystemExit("carrier PR base mismatch")
          ref_path = f"/git/ref/heads/{quote(CARRIER, safe='/')}"
          ref = api("GET", ref_path, allow_404=True)
          receipt = {"repository":REPOSITORY,"pr":PR_NUMBER,"carrier":CARRIER,"expected_main":EXPECTED_MAIN,"state":"STARTED"}
          if ref is None:
            receipt["state"] = "ALREADY_ABSENT"
          else:
            receipt["observed_head"] = str((ref.get("object") or {}).get("sha") or "")
            api("DELETE", f"/git/refs/heads/{quote(CARRIER, safe='/')}")
            absent = False
            for attempt in range(6):
              if api("GET", ref_path, allow_404=True) is None:
                absent = True
                break
              if attempt < 5:
                time.sleep(0.5)
            receipt["post_effect_absent"] = absent
            receipt["state"] = "RECONCILED_PASS" if absent else "FAILED_CLOSED"
            if not absent:
              out.write_text(json.dumps(receipt, indent=2) + "\n")
              raise SystemExit("carrier ref still present")
          out.write_text(json.dumps(receipt, indent=2) + "\n")
          PY
      - name: Preserve carrier retirement receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drj-ckgb-carrier-retire-${{ github.run_id }}
          path: /tmp/drj-ckgb-carrier-retire.json
          if-no-files-found: warn
          retention-days: 30
