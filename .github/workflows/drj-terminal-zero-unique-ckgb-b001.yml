name: DRJ CKGB Narrowed ZERO_UNIQUE Effect

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/drj-terminal-zero-unique-ckgb-b001.yml

concurrency:
  group: drj-terminal-zero-unique-ckgb-b001a
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: >-
      github.event.pull_request.head.ref == 'drj/76-terminal-zero-unique-ckgb-b001' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.user.login == 'jenshaberle-dotcom'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact narrowed CKGB preflight and effect
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          from datetime import UTC, datetime
          import json, os, time
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import quote, urlencode
          from urllib.request import Request, urlopen

          REPOSITORY = "jenshaberle-dotcom/current-known-good-baseline"
          REPOSITORY_ID = 1276271604
          EXPECTED_MAIN = "2834c2e3a1c21ba03a46a7c929447f636aaae387"
          AUTHORITY_REFERENCE = "github-issue-comment:jenshaberle-dotcom/Data-Retention-Janitor#76:5579673533"
          ISSUED_AT = datetime.fromisoformat("2026-09-08T05:15:00+00:00")
          EXPIRES_AT = datetime.fromisoformat("2026-09-08T06:00:00+00:00")
          PREFLIGHT_RUN = 34190006542
          TARGETS = [
            ("agent/rcc-cngb-platform-only-warm-profile-001a","c913bb273b2df4b7893fb6e83267f85f12570c32"),
            ("agent/ckgb-deadwalker-harvest-001a","37b1db17201df9a545d98c2ab2b4415c12a5bae2"),
            ("agent/ckgb-post-harvest-hygiene-001a","8680987a57ae0e1c47354fbb9306aa938ae2f9fa"),
          ]
          EXPLICITLY_EXCLUDED = {
            "agent/ckgb-reentry-failure-antipatterns-001a",
            "agent/ckgb-final-hygiene-pass-001a",
            "agent/ckgb-deadwalker-quarantine-001b",
            "agent/knowledge-research-layer-v1",
            "agent/portfolio-foundations-align-v1",
            "agent/portfolio-reentry-v1",
            "agent/post-migration-restart-gate-v1",
            "agent/project-state-reconcile-v2",
            "agent/warm-hosted-fallback-001a",
            "drj/workspace-v2-wsl-canonical",
            "drj-013-work-admission-001a",
            "ops/rcc-runner-contract-v1",
          }

          if os.environ.get("GITHUB_REPOSITORY") != REPOSITORY:
            raise SystemExit("repository transport mismatch")
          now = datetime.now(UTC)
          if not (ISSUED_AT <= now <= EXPIRES_AT):
            raise SystemExit(f"OWNER authority expired/not-yet-valid: {now.isoformat()}")
          if len(TARGETS) != 3 or len({b for b,_ in TARGETS}) != 3:
            raise SystemExit("invalid narrowed exact target set")
          if any(b in EXPLICITLY_EXCLUDED for b,_ in TARGETS):
            raise SystemExit("excluded ref leaked into target set")

          token = os.environ["GH_TOKEN"]
          root = f"https://api.github.com/repos/{REPOSITORY}"
          out = Path("/tmp/drj-ckgb-b001a-effect.json")
          receipt = {
            "schema_version":"drj.ephemeral_target_repo_effect_receipt.v1",
            "repository":REPOSITORY,
            "repository_id":REPOSITORY_ID,
            "authority_reference":AUTHORITY_REFERENCE,
            "fresh_preflight_run":PREFLIGHT_RUN,
            "expected_main":EXPECTED_MAIN,
            "targets":[{"branch":b,"expected_sha":s} for b,s in TARGETS],
            "preflight":[],
            "effects":[],
            "already_absent":[],
            "state":"STARTED",
          }

          def persist():
            out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          def api(method, path, allow_404=False):
            req = Request(root + path, method=method, headers={
              "Accept":"application/vnd.github+json",
              "Authorization":f"Bearer {token}",
              "X-GitHub-Api-Version":"2022-11-28",
              "User-Agent":"drj-ckgb-narrowed-zero-unique-b001a",
            })
            try:
              with urlopen(req, timeout=30) as r:
                raw = r.read()
                return json.loads(raw) if raw else None
            except HTTPError as exc:
              if allow_404 and exc.code == 404:
                return None
              raise RuntimeError(f"GitHub API {method} {path} failed: {exc.code} {exc.read().decode('utf-8', errors='replace')}") from exc

          def main_sha():
            return str((api("GET", "/git/ref/heads/main").get("object") or {}).get("sha") or "")

          def observe(branch, expected_sha):
            if main_sha() != EXPECTED_MAIN:
              raise RuntimeError("canonical CKGB main moved")
            ref = api("GET", f"/git/ref/heads/{quote(branch, safe='/')}", allow_404=True)
            if ref is None:
              return {"branch":branch,"expected_sha":expected_sha,"state":"ALREADY_ABSENT"}
            observed = str((ref.get("object") or {}).get("sha") or "")
            if observed != expected_sha:
              raise RuntimeError(f"target SHA drift: {branch} expected={expected_sha} observed={observed}")
            meta = api("GET", f"/branches/{quote(branch, safe='')}")
            if bool(meta.get("protected", False)):
              raise RuntimeError(f"GitHub protection blocks {branch}")
            owner = REPOSITORY.split('/', 1)[0]
            h = urlencode({"state":"open","head":f"{owner}:{branch}","per_page":"1"})
            b = urlencode({"state":"open","base":branch,"per_page":"1"})
            if api("GET", f"/pulls?{h}") or api("GET", f"/pulls?{b}"):
              raise RuntimeError(f"live open PR protects {branch}")
            cmp = api("GET", f"/compare/main...{quote(branch, safe='')}")
            ahead = int(cmp["ahead_by"])
            behind = int(cmp["behind_by"])
            if ahead != 0:
              raise RuntimeError(f"DIVERGENT target rejected: {branch} ahead_by={ahead}")
            return {"branch":branch,"sha":observed,"ahead_by":ahead,"behind_by":behind,"state":"PRESENT_SAFE"}

          try:
            repo = api("GET", "")
            if int(repo["id"]) != REPOSITORY_ID or str(repo["default_branch"]) != "main":
              raise RuntimeError("repository identity/default mismatch")
            if main_sha() != EXPECTED_MAIN:
              raise RuntimeError("canonical CKGB main does not match narrowed authority")
            pre = [observe(b,s) for b,s in TARGETS]
            receipt["preflight"] = pre
            present = [x for x in pre if x["state"] == "PRESENT_SAFE"]
            receipt["already_absent"] = [x["branch"] for x in pre if x["state"] == "ALREADY_ABSENT"]
            receipt["state"] = "PREFLIGHT_PASS"
            persist()
            by_branch = dict(TARGETS)
            for item in present:
              branch = item["branch"]
              fresh = observe(branch, by_branch[branch])
              if fresh["state"] == "ALREADY_ABSENT":
                receipt["already_absent"].append(branch)
                persist()
                continue
              api("DELETE", f"/git/refs/heads/{quote(branch, safe='/')}")
              absent = False
              for attempt in range(6):
                if api("GET", f"/git/ref/heads/{quote(branch, safe='/')}", allow_404=True) is None:
                  absent = True
                  break
                if attempt < 5:
                  time.sleep(min(0.5 * (attempt + 1), 1.0))
              receipt["effects"].append({**fresh,"delete_requests":1,"post_effect_absent":absent})
              persist()
              if not absent:
                raise RuntimeError(f"post-effect absence not observed for {branch}")
            receipt["state"] = "RECONCILED_PASS"
            receipt["effects_reconciled_pass"] = len(receipt["effects"])
            receipt["desired_state_reconciled"] = len(set(receipt["already_absent"])) + len(receipt["effects"])
            receipt["completed_at"] = datetime.now(UTC).isoformat()
            persist()
            Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              f"# CKGB narrowed ZERO_UNIQUE effect\n\nEffects: **{len(receipt['effects'])}**; already absent: **{len(set(receipt['already_absent']))}**; reconciled: **{receipt['desired_state_reconciled']}/3**\n",
              encoding="utf-8",
            )
          except Exception as exc:
            receipt["state"] = "FAILED_CLOSED"
            receipt["error"] = str(exc)
            receipt["completed_at"] = datetime.now(UTC).isoformat()
            persist()
            raise
          PY
      - name: Preserve effect receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drj-ckgb-zero-unique-b001a-${{ github.run_id }}
          path: /tmp/drj-ckgb-b001a-effect.json
          if-no-files-found: warn
          retention-days: 90
